<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日 AI 创作分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .date {
            color: #888;
            font-size: 0.9rem;
        }
        
        .section {
            margin: 40px 0;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: #00d9ff;
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid #00d9ff;
        }
        
        /* 图片画廊 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: rgba(255,255,255,0.05);
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,217,255,0.2);
        }
        
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        
        .gallery-item .info {
            padding: 15px;
        }
        
        .gallery-item .filename {
            font-size: 0.85rem;
            color: #aaa;
        }
        
        /* 音乐播放器 */
        .music-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .music-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: background 0.3s ease;
        }
        
        .music-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .music-item.playing {
            background: linear-gradient(135deg, rgba(0,217,255,0.2), rgba(0,255,136,0.1));
            border: 1px solid rgba(0,217,255,0.3);
        }
        
        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        
        .play-btn:hover {
            transform: scale(1.1);
        }
        
        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: #1a1a2e;
        }
        
        .music-info {
            flex: 1;
        }
        
        .music-title {
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .music-date {
            font-size: 0.8rem;
            color: #888;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }
        
        /* 音频元素 */
        audio {
            display: none;
        }
        
        /* 灯箱 */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
        }
        
        /* 全局播放器（浮动在底部） */
        .global-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26,26,46,0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }
        
        .global-player.active {
            display: flex;
        }
        
        .global-player .now-playing {
            flex: 1;
            min-width: 0;
        }
        
        .global-player .now-playing-title {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .global-player .now-playing-status {
            font-size: 0.75rem;
            color: #00d9ff;
        }
        
        .global-player .play-btn {
            width: 40px;
            height: 40px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .music-item {
                padding: 15px;
            }
        }
        
        /* 空状态 */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 每日 AI 创作分享</h1>
            <p class="date" id="currentDate"></p>
        </header>
        
        <section class="section">
            <h2 class="section-title">🖼️ 今日美图</h2>
            <div class="gallery" id="gallery"></div>
        </section>
        
        <section class="section">
            <h2 class="section-title">🎶 今日音乐</h2>
            <div class="music-list" id="musicList"></div>
        </section>
    </div>
    
    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="" id="lightboxImg">
    </div>
    
    <!-- 全局播放器 -->
    <div class="global-player" id="globalPlayer">
        <button class="play-btn" id="globalPlayBtn">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div class="now-playing">
            <div class="now-playing-title" id="nowPlayingTitle">未选择</div>
            <div class="now-playing-status" id="nowPlayingStatus">点击播放</div>
        </div>
    </div>
    
    <script>
        // 音乐数据
        const musicFiles = [
            { file: 'music/song_2026-04-27_001.mp3', title: '4月27日创作 #1' },
            { file: 'music/song_2026-04-27_002.mp3', title: '4月27日创作 #2' },
            { file: 'music/song_2026-05-05_001.mp3', title: '5月5日创作 #1' },
            { file: 'music/song_2026-05-05_002.mp3', title: '5月5日创作 #2' },
            { file: 'music/song_2026-05-05_003.mp3', title: '5月5日创作 #3' },
            { file: 'music/song_2026-05-05_004.mp3', title: '5月5日创作 #4' }
        ];
        
        // 图片数据
        const imageFiles = [
            { file: 'image/img_2026-04-28_001.jpg', title: '4月28日创作' },
            { file: 'image/img_2026-04-28_002.jpg', title: '4月28日创作 #2' }
        ];
        
        // 显示日期
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('currentDate').textContent = today.toLocaleDateString('zh-CN', options);
        
        // 渲染图片画廊
        const gallery = document.getElementById('gallery');
        imageFiles.forEach(img => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${img.file}" alt="${img.title}" loading="lazy">
                <div class="info">
                    <div class="filename">${img.title}</div>
                </div>
            `;
            item.addEventListener('click', () => openLightbox(img.file));
            gallery.appendChild(item);
        });
        
        // 灯箱
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        
        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
        }
        
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
        
        // 全局播放器
        const globalPlayer = document.getElementById('globalPlayer');
        const globalPlayBtn = document.getElementById('globalPlayBtn');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingStatus = document.getElementById('nowPlayingStatus');
        
        const playIcon = document.querySelector('.play-icon');
        const pauseIcon = document.querySelector('.pause-icon');
        
        let currentAudio = null;
        let currentMusicItem = null;
        
        function playMusic(musicItem, audioSrc) {
            // 停止当前播放
            if (currentAudio) {
                currentAudio.pause();
                if (currentMusicItem) {
                    currentMusicItem.classList.remove('playing');
                }
            }
            
            // 如果点击的是同一首歌，切换播放/暂停
            if (currentAudio && currentAudio.src.includes(audioSrc)) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    updatePlayState(true);
                } else {
                    currentAudio.pause();
                    updatePlayState(false);
                }
                return;
            }
            
            // 创建新的音频对象
            currentAudio = new Audio(audioSrc);
            currentMusicItem = musicItem;
            
            currentAudio.addEventListener('timeupdate', updateProgress);
            currentAudio.addEventListener('ended', () => {
                updatePlayState(false);
                nowPlayingStatus.textContent = '播放完成';
            });
            
            currentAudio.play();
            updatePlayState(true);
            globalPlayer.classList.add('active');
            musicItem.classList.add('playing');
        }
        
        function updatePlayState(isPlaying) {
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                nowPlayingStatus.textContent = '正在播放';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                nowPlayingStatus.textContent = '已暂停';
            }
        }
        
        function updateProgress() {
            if (!currentAudio) return;
            const progress = (currentAudio.currentTime / currentAudio.duration) * 100;
            const progressEl = currentMusicItem.querySelector('.progress');
            const timeEl = currentMusicItem.querySelector('.time');
            if (progressEl) progressEl.style.width = progress + '%';
            if (timeEl) {
                timeEl.textContent = formatTime(currentAudio.currentTime) + ' / ' + formatTime(currentAudio.duration);
            }
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
        
        globalPlayBtn.addEventListener('click', () => {
            if (!currentAudio) return;
            if (currentAudio.paused) {
                currentAudio.play();
                updatePlayState(true);
            } else {
                currentAudio.pause();
                updatePlayState(false);
            }
        });
        
        // 渲染音乐列表
        const musicList = document.getElementById('musicList');
        musicFiles.forEach(music => {
            const item = document.createElement('div');
            item.className = 'music-item';
            item.innerHTML = `
                <button class="play-btn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="music-info">
                    <div class="music-title">${music.title}</div>
                    <div class="time">点击播放</div>
                    <div class="progress-bar"><div class="progress"></div></div>
                </div>
            `;
            
            const playBtn = item.querySelector('.play-btn');
            playBtn.addEventListener('click', () => {
                const titleEl = item.querySelector('.music-title');
                nowPlayingTitle.textContent = titleEl.textContent;
                playMusic(item, music.file);
            });
            
            musicList.appendChild(item);
        });
    </script>
</body>
</html>
